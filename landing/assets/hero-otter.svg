<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="MediaOtter hero illustration: an otter in flowing line-art style holding a glowing play-button orb, surrounded by swirling ornamental strokes and media icons">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#edff45" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#edff45" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#edff45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ffb0"/>
      <stop offset="55%" stop-color="#edff45"/>
      <stop offset="100%" stop-color="#c9d62e"/>
    </linearGradient>
    <style>
      .L{fill:none;stroke:#f5f5f5;stroke-linecap:round;stroke-linejoin:round}
      .L1{stroke-width:3.5;opacity:.92}
      .L2{stroke-width:2.4;opacity:.6}
      .L3{stroke-width:1.6;opacity:.38}
      .A{fill:none;stroke:#edff45;stroke-linecap:round;stroke-linejoin:round}
      .A1{stroke-width:3.2;opacity:.95}
      .A2{stroke-width:2.2;opacity:.55}
      .fillw{fill:#f5f5f5}
      .filla{fill:#edff45}
      .soft{fill:#f5f5f5;opacity:.12}
    </style>
  </defs>

  <!-- ================= ORNAMENTAL FIELD ================= -->
  <g id="field">
    <!-- big sweeping arcs behind everything -->
    <path class="L L3" d="M-40 880 Q 200 520 450 560 Q 700 600 940 300"/>
    <path class="L L3" d="M-60 760 Q 240 420 520 470 Q 760 512 950 180"/>
    <path class="L L3" d="M60 1080 Q 300 760 560 800 Q 780 834 920 620"/>
    <path class="A A2" d="M-20 960 Q 260 640 500 690 Q 720 736 900 480"/>
    <!-- concentric circles around the orb -->
    <circle class="L L3" cx="450" cy="240" r="150"/>
    <circle class="L L3" cx="450" cy="240" r="200" stroke-dasharray="2 18"/>
    <circle class="A A2" cx="450" cy="240" r="250" stroke-dasharray="1 30"/>
    <!-- radiating ticks from orb -->
    <g class="L L3">
      <path d="M450 20 v50"/><path d="M610 60 l-30 42"/><path d="M700 240 h-52"/>
      <path d="M290 60 l30 42"/><path d="M200 240 h52"/>
      <path d="M640 410 l-36 -32"/><path d="M260 410 l36 -32"/>
    </g>
    <!-- floating dots constellation -->
    <g class="fillw" opacity=".5">
      <circle cx="130" cy="150" r="3.5"/><circle cx="770" cy="120" r="3"/>
      <circle cx="830" cy="430" r="3.5"/><circle cx="80" cy="420" r="3"/>
      <circle cx="120" cy="640" r="3.5"/><circle cx="800" cy="700" r="3"/>
      <circle cx="240" cy="940" r="3"/><circle cx="680" cy="940" r="3.5"/>
      <circle cx="450" cy="1000" r="3"/><circle cx="330" cy="60" r="3"/>
      <circle cx="590" cy="40" r="3.5"/>
    </g>
    <!-- sparkle crosses -->
    <g class="A A1" stroke-width="2.6">
      <path d="M170 280 v26 M157 293 h26"/>
      <path d="M730 560 v22 M719 571 h22"/>
      <path d="M255 830 v20 M245 840 h20"/>
    </g>
  </g>

  <!-- ================= FLOATING ICON CHIPS (fine-line style) ================= -->
  <g id="chips">
    <!-- play button diamond (top-left) -->
    <g transform="translate(150 380) rotate(-12)">
      <rect class="L L1" x="-44" y="-44" width="88" height="88" rx="14"/>
      <path class="filla" d="M-12 -16 L20 0 L-12 16 Z"/>
    </g>
    <!-- waveform chip (right) -->
    <g transform="translate(760 420) rotate(9)">
      <rect class="L L1" x="-48" y="-40" width="96" height="80" rx="14"/>
      <path class="A A1" stroke-width="2.8" d="M-30 0 h6 M-18 -12 v24 M-6 -20 v40 M6 -8 v16 M18 -15 v30 M30 -4 v8"/>
    </g>
    <!-- download chip (left lower) -->
    <g transform="translate(140 640) rotate(8)">
      <rect class="L L1" x="-42" y="-42" width="84" height="84" rx="14"/>
      <path class="A A1" stroke-width="2.8" d="M0 -18 V10 M-12 -2 L0 12 L12 -2 M-20 22 H20"/>
    </g>
    <!-- film strip chip (right lower) -->
    <g transform="translate(755 670) rotate(-9)">
      <rect class="L L1" x="-46" y="-36" width="92" height="72" rx="12"/>
      <path class="L L2" d="M-30 -20 H30 M-30 0 H30 M-30 20 H30"/>
      <path class="A A1" stroke-width="2.6" d="M-30 0 H-8"/>
    </g>
    <!-- music note (bottom-left of otter) -->
    <g transform="translate(255 890) rotate(-7)">
      <path class="L L1" d="M10 -26 V14 a11 11 0 1 1 -9 -10 M10 -26 q18 -5 21 11"/>
    </g>
    <!-- scissors (bottom-right) -->
    <g transform="translate(655 880) rotate(6)">
      <circle class="L L1" cx="-12" cy="12" r="9"/>
      <circle class="L L1" cx="12" cy="12" r="9"/>
      <path class="L L1" d="M-7 5 L16 -18 M7 5 L-16 -18"/>
    </g>
  </g>

  <!-- ================= THE ORB ================= -->
  <g id="orb">
    <circle cx="450" cy="240" r="140" fill="url(#orbGlow)"/>
    <circle cx="450" cy="240" r="86" fill="url(#orbCore)"/>
    <!-- fine engraved globe lines -->
    <g class="L" stroke="#0b0e1a" opacity=".4">
      <circle cx="450" cy="240" r="86" stroke-width="3"/>
      <ellipse cx="450" cy="240" rx="86" ry="30" stroke-width="2"/>
      <ellipse cx="450" cy="240" rx="86" ry="58" stroke-width="1.6"/>
      <ellipse cx="450" cy="240" rx="30" ry="86" stroke-width="2"/>
      <ellipse cx="450" cy="240" rx="58" ry="86" stroke-width="1.6"/>
    </g>
    <!-- play triangle -->
    <path d="M428 202 L498 240 L428 278 Z" fill="#0b0e1a"/>
    <!-- orbiting ring -->
    <ellipse class="A A1" cx="450" cy="240" rx="128" ry="40" transform="rotate(-18 450 240)" stroke-dasharray="60 22"/>
    <!-- sparkles on orb -->
    <g class="L L2" stroke-width="2.4">
      <path d="M318 150 v16 M310 158 h16"/>
      <path d="M596 320 v14 M589 327 h14"/>
    </g>
  </g>

  <!-- ================= THE OTTER (fine line-art / engraving style) ================= -->
  <g id="otter">
    <!-- swirling water current the otter floats on -->
    <path class="L L2" d="M180 900 Q 330 850 450 890 Q 570 930 720 880"/>
    <path class="L L3" d="M210 940 Q 340 900 450 930 Q 560 960 690 920"/>
    <path class="A A2" d="M250 975 Q 360 945 450 968 Q 540 990 650 955"/>

    <!-- tail -->
    <path class="L L1" d="M330 830 Q 220 860 160 940 Q 130 980 165 995 Q 250 1020 350 960"/>
    <path class="L L2" d="M320 855 Q 245 880 200 935"/>

    <!-- body — long flowing swimming pose, reaching up -->
    <path class="L L1" d="M450 560
      C 380 560 320 620 305 700
      C 292 770 300 850 340 905
      C 375 955 425 975 450 975
      C 475 975 525 955 560 905
      C 600 850 608 770 595 700
      C 580 620 520 560 450 560 Z"/>
    <!-- belly contour -->
    <path class="L L2" d="M450 640 C 395 640 355 700 350 780 C 346 855 385 920 450 928 C 515 920 554 855 550 780 C 545 700 505 640 450 640 Z"/>
    <!-- fur texture strokes on body -->
    <g class="L L3">
      <path d="M340 720 q 18 8 30 2"/><path d="M330 780 q 18 8 30 2"/>
      <path d="M345 840 q 18 8 30 2"/><path d="M560 720 q -18 8 -30 2"/>
      <path d="M570 780 q -18 8 -30 2"/><path d="M555 840 q -18 8 -30 2"/>
    </g>

    <!-- left arm reaching up to orb -->
    <path class="L L1" d="M368 640 C 330 590 315 520 330 460 C 338 428 360 418 375 435 C 388 450 385 480 390 520 C 396 565 410 600 425 620"/>
    <!-- right arm reaching up -->
    <path class="L L1" d="M532 640 C 570 590 585 520 570 460 C 562 428 540 418 525 435 C 512 450 515 480 510 520 C 504 565 490 600 475 620"/>
    <!-- paws -->
    <circle class="L L1" cx="345" cy="445" r="26"/>
    <circle class="L L1" cx="555" cy="445" r="26"/>
    <path class="L L3" d="M335 445 h20 M345 435 v20 M545 445 h20 M555 435 v20"/>

    <!-- head -->
    <path class="L L1" d="M450 380
      C 385 380 340 425 338 490
      C 336 545 375 595 450 600
      C 525 595 564 545 562 490
      C 560 425 515 380 450 380 Z"/>
    <!-- ears -->
    <path class="L L1" d="M368 395 C 350 370 320 372 312 395 C 305 415 320 435 342 432"/>
    <path class="L L1" d="M532 395 C 550 370 580 372 588 395 C 595 415 580 435 558 432"/>
    <path class="L L2" d="M362 402 C 350 388 332 390 328 404"/>
    <path class="L L2" d="M538 402 C 550 388 568 390 572 404"/>

    <!-- muzzle -->
    <path class="L L2" d="M450 505 C 415 505 395 525 397 550 C 399 575 425 590 450 590 C 475 590 501 575 503 550 C 505 525 485 505 450 505 Z"/>
    <!-- nose -->
    <path class="L L1" d="M450 512 C 438 512 432 519 433 527 C 434 535 442 540 450 540 C 458 540 466 535 467 527 C 468 519 462 512 450 512 Z"/>
    <path class="filla" d="M450 517 C 444 517 440 521 441 526 C 442 531 446 533 450 533 C 454 533 458 531 459 526 C 460 521 456 517 450 517 Z"/>
    <!-- mouth + whiskers -->
    <path class="L L2" d="M450 540 v10 M450 550 q -12 10 -24 5 M450 550 q 12 10 24 5"/>
    <g class="L L3">
      <path d="M398 540 q -28 -4 -46 4"/><path d="M400 552 q -26 2 -42 12"/>
      <path d="M502 540 q 28 -4 46 4"/><path d="M500 552 q 26 2 42 12"/>
    </g>
    <!-- eyes — bright lime dots with fine lids -->
    <path class="L L2" d="M395 472 q 16 -14 36 -4"/>
    <path class="L L2" d="M469 468 q 20 -10 36 4"/>
    <circle class="filla" cx="415" cy="478" r="7"/>
    <circle class="filla" cx="485" cy="478" r="7"/>
    <circle class="fillw" cx="417.5" cy="475.5" r="2.2"/>
    <circle class="fillw" cx="487.5" cy="475.5" r="2.2"/>
    <!-- brow fur lines -->
    <g class="L L3">
      <path d="M400 445 q 15 -8 30 -2"/><path d="M470 443 q 15 -6 30 2"/>
      <path d="M420 415 q 30 -10 60 0"/>
    </g>

    <!-- HEADPHONES — fine-line style -->
    <path class="L L1" d="M345 460 C 330 360 380 300 450 298 C 520 300 570 360 555 460"/>
    <path class="A A2" d="M352 455 C 340 365 385 310 450 308 C 515 310 560 365 548 455"/>
    <!-- ear cups -->
    <path class="L L1" d="M330 445 C 322 445 315 455 315 475 C 315 500 322 515 332 515 C 342 515 350 500 350 480 C 350 460 342 445 330 445 Z"/>
    <path class="L L1" d="M570 445 C 578 445 585 455 585 475 C 585 500 578 515 568 515 C 558 515 550 500 550 480 C 550 460 558 445 570 445 Z"/>
    <circle class="filla" cx="332" cy="482" r="7"/>
    <circle class="filla" cx="568" cy="482" r="7"/>
    <!-- sound waves from cups -->
    <path class="A A2" d="M300 470 q -14 12 0 26 M600 470 q 14 12 0 26"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="MediaOtter hero illustration: serene otter wearing large over-ear headphones, eyes closed, presenting a glowing play-button orb">
<title>MediaOtter — serene otter with headphones presenting a glowing orb</title>
<defs>
  <radialGradient id="orbCore" cx="38%" cy="32%" r="72%">
    <stop offset="0%" stop-color="#fbffd8"/>
    <stop offset="38%" stop-color="#edff45"/>
    <stop offset="78%" stop-color="#edff45"/>
    <stop offset="100%" stop-color="#b9c62e"/>
  </radialGradient>
  <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#edff45" stop-opacity="0.42"/>
    <stop offset="38%" stop-color="#edff45" stop-opacity="0.18"/>
    <stop offset="68%" stop-color="#edff45" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#edff45" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="litPlane" x1="78%" y1="12%" x2="18%" y2="88%">
    <stop offset="0%" stop-color="#dce6f7"/>
    <stop offset="52%" stop-color="#8fa3d0"/>
    <stop offset="100%" stop-color="#8fa3d0"/>
  </linearGradient>
  <linearGradient id="midPlane" x1="72%" y1="18%" x2="28%" y2="82%">
    <stop offset="0%" stop-color="#8fa3d0"/>
    <stop offset="60%" stop-color="#4a5a8a"/>
    <stop offset="100%" stop-color="#4a5a8a"/>
  </linearGradient>
  <linearGradient id="shadowPlane" x1="78%" y1="14%" x2="18%" y2="86%">
    <stop offset="0%" stop-color="#4a5a8a"/>
    <stop offset="100%" stop-color="#232c4e"/>
  </linearGradient>
  <linearGradient id="muzzleFill" x1="62%" y1="14%" x2="38%" y2="86%">
    <stop offset="0%" stop-color="#dce6f7"/>
    <stop offset="58%" stop-color="#dce6f7"/>
    <stop offset="100%" stop-color="#8fa3d0"/>
  </linearGradient>
  <linearGradient id="torsoLit" x1="78%" y1="18%" x2="22%" y2="82%">
    <stop offset="0%" stop-color="#8fa3d0"/>
    <stop offset="48%" stop-color="#4a5a8a"/>
    <stop offset="100%" stop-color="#4a5a8a"/>
  </linearGradient>
</defs>

<!-- grounded anchor — soft wide shadow under shoulders -->
<ellipse cx="452" cy="1062" rx="348" ry="44" fill="#232c4e" opacity="0.18"/>

<!-- SHOULDERS / TORSO — broad portrait, fills lower 2/3, spreads to bottom edge -->
<path d="M 34 1100 L 34 992 C 68 872 208 742 395 706 L 395 740 C 390 760 386 800 384 840 L 384 1100 Z" fill="#232c4e" opacity="0.96"/>
<path d="M 395 706 C 432 690 478 690 515 706 C 702 742 842 872 876 992 L 876 1100 L 384 1100 L 384 840 C 386 800 390 760 395 740 Z" fill="url(#torsoLit)"/>
<!-- lit chest plane — faces upper-right orb -->
<path d="M 464 744 C 556 762 648 812 692 912 L 692 1100 L 468 1100 C 464 1002 456 900 424 828 C 434 788 448 754 464 744 Z" fill="url(#litPlane)" opacity="0.92"/>

<!-- NECK — visible -->
<path d="M 392 628 L 392 718 C 392 718 432 736 454 736 C 476 736 516 718 516 718 L 516 628 Z" fill="url(#shadowPlane)"/>
<path d="M 444 630 L 516 630 L 516 718 C 492 726 462 732 444 722 C 438 688 440 648 444 630 Z" fill="#8fa3d0" opacity="0.74"/>

<!-- HEADPHONES cups — behind head, ~30% overlap (head drawn on top of inner edge) -->
<ellipse cx="296" cy="506" rx="54" ry="78" fill="#4a5a8a"/>
<ellipse cx="612" cy="506" rx="58" ry="82" fill="#4a5a8a"/>
<path d="M 254 438 C 240 462 236 492 242 524 C 246 496 254 470 268 448 C 280 428 296 416 316 410 C 282 410 262 418 254 438 Z" fill="#dce6f7" opacity="0.96"/>
<path d="M 564 428 C 548 452 544 484 552 518 C 556 490 566 464 582 442 C 596 422 616 410 640 404 C 602 404 574 410 564 428 Z" fill="#dce6f7" opacity="0.98"/>

<!-- HEAD — sweeping silhouette, ~42% of figure height -->
<path d="M 312 468 C 284 414 316 352 384 324 C 438 302 522 312 568 352 C 612 390 626 452 612 516 C 598 580 554 628 484 652 C 412 672 332 634 310 562 C 302 524 304 492 312 468 Z" fill="#4a5a8a"/>
<!-- jaw / neck shadow — lower-left falloff -->
<path d="M 312 468 C 298 492 298 534 320 574 C 344 612 392 644 452 660 C 484 652 516 634 544 606 C 502 612 462 604 430 578 C 374 534 348 492 360 452 C 336 452 318 460 312 468 Z" fill="url(#shadowPlane)"/>
<!-- lit forehead — upper-right -->
<path d="M 384 324 C 438 302 522 312 568 352 C 552 384 508 408 458 412 C 412 412 376 390 368 348 C 372 334 376 328 384 324 Z" fill="url(#litPlane)" opacity="0.98"/>
<!-- cheek plane — large smooth -->
<path d="M 368 452 C 408 438 476 436 528 462 C 542 490 534 526 508 558 C 462 580 404 578 364 548 C 332 524 340 474 368 452 Z" fill="url(#midPlane)" opacity="0.98"/>
<!-- muzzle — lighter -->
<path d="M 298 504 C 270 518 262 552 278 582 C 294 612 332 630 376 626 C 410 620 430 596 430 564 C 430 528 398 504 352 500 C 326 498 306 500 298 504 Z" fill="url(#muzzleFill)"/>
<ellipse cx="302" cy="546" rx="16" ry="12.5" fill="#232c4e"/>
<ellipse cx="298" cy="542" rx="6.5" ry="4.5" fill="#dce6f7" opacity="0.92"/>

<!-- EARS — small rounded triangles tucked near headphone band -->
<path d="M 364 344 C 352 324 332 314 322 328 C 312 342 320 362 342 372 C 356 374 366 360 364 344 Z" fill="#4a5a8a"/>
<path d="M 344 334 C 336 330 328 332 326 340 C 324 350 332 360 344 362 C 352 360 356 350 350 338 Z" fill="#dce6f7" opacity="0.94"/>
<path d="M 548 348 C 562 326 582 316 594 330 C 604 344 596 364 574 374 C 560 376 548 364 548 348 Z" fill="#4a5a8a"/>
<path d="M 570 334 C 578 330 586 332 588 340 C 590 350 582 360 570 362 C 562 360 558 350 562 338 Z" fill="#dce6f7" opacity="0.94"/>

<!-- HEADPHONES band — bold 28px arch over head, visually connects both cups with no gap -->
<path d="M 296 500 L 296 445 C 300 365 368 304 452 290 C 536 304 608 365 612 445 L 612 500 C 608 385 550 322 452 318 C 354 322 300 385 296 500 Z" fill="#4a5a8a"/>

<!-- PAW + ARM — single smooth tapered limb from lower-left chest to wrist under orb -->
<path d="M 287 794 L 343 836 L 632.5 442.9 L 603.7 421.2 Z" fill="#8fa3d0"/>
<path d="M 287 794 L 603.7 421.2 L 614 429 L 297.5 801.7 Z" fill="#4a5a8a" opacity="0.98"/>
<!-- paw — open upturned mitten, palm-up, 2 shade planes, directly under orb gap ≤12px -->
<path d="M 576 416 C 558 400 560 376 584 364 C 610 352 646 366 664 386 C 678 402 678 422 664 438 C 640 456 598 452 576 416 Z" fill="#8fa3d0"/>
<path d="M 584 364 C 604 352 634 356 656 374 C 646 388 626 398 604 398 C 582 398 564 386 576 416 C 560 404 560 380 584 364 Z" fill="#dce6f7" opacity="0.96"/>
<!-- halo wash over paw top plane -->
<ellipse cx="620" cy="382" rx="36" ry="16" fill="#edff45" opacity="0.25"/>

<!-- ORB — at (620,300) upper-right, just above paw -->
<circle cx="620" cy="300" r="132" fill="url(#orbHalo)"/>
<circle cx="620" cy="300" r="62" fill="url(#orbCore)"/>
<ellipse cx="604" cy="278" rx="26" ry="20" fill="white" opacity="0.20"/>
<path d="M 600 272 L 644 300 L 600 328 Z" fill="#0b0e1a" opacity="0.98"/>
<circle cx="684" cy="242" r="4.2" fill="#edff45" opacity="0.95"/>
<circle cx="694" cy="268" r="2.6" fill="#edff45" opacity="0.88"/>
<circle cx="674" cy="368" r="3.4" fill="#edff45" opacity="0.92"/>

<!-- FACE DETAILS — eyes sit ON muzzle upper edge, slightly curved downward, symmetric serene -->
<path d="M 360 506 C 376 524 404 524 420 506" fill="none" stroke="#dce6f7" stroke-width="4" stroke-linecap="round" opacity="0.96"/>
<path d="M 476 506 C 492 524 520 524 536 506" fill="none" stroke="#dce6f7" stroke-width="4" stroke-linecap="round" opacity="0.96"/>
<path d="M 304 566 C 310 574 320 578 334 574" fill="none" stroke="#dce6f7" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
</svg>
